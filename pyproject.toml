[project]
name = "ai-powered-portfolio-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Divyansh Verma", email = "divyanshv8077@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "firebase-admin>=7.5.0",
    "groq>=1.7.0",
    "pydantic>=2.13.5",
    "pypdf>=6.17.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[project.scripts]
ai-powered-portfolio-chatbot = "ai_powered_portfolio_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
